[project]
name = "debcraft"
version = "0.1.0"
description = "Artifact Intelligence Platform for Debian-based ecosystems"
requires-python = ">=3.13"
license = "MIT"
readme = "README.md"
dependencies = [
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "greenlet>=3.5.4",
    "jsonschema>=4.20",
    "rich>=13.0",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "zstandard>=0.22",
]

[project.scripts]
debcraft = "debcraft.cli:app"

[project.entry-points."debcraft.scanners"]
directory = "debcraft.infrastructure.scanners.directory:DirectoryScanner"
docker = "debcraft.infrastructure.scanners.docker:DockerScanner"
oci = "debcraft.infrastructure.scanners.oci:OCIScanner"
iso = "debcraft.infrastructure.scanners.iso:ISOScanner"
qcow2 = "debcraft.infrastructure.scanners.qcow2:QCOW2Scanner"
img = "debcraft.infrastructure.scanners.img:IMGScanner"
ami = "debcraft.infrastructure.scanners.ami:AMIScanner"

[project.entry-points."debcraft.sbom_writers"]
spdx_3_0 = "debcraft.infrastructure.sbom_writers.spdx3:SPDX3Writer"
spdx_2_3 = "debcraft.infrastructure.sbom_writers.spdx23:SPDX23Writer"
cyclonedx = "debcraft.infrastructure.sbom_writers.cyclonedx:CycloneDXWriter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "basedpyright>=1.20",
    "pylint>=4.0.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "coverage>=7.0",
    "hypothesis>=6.100",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "import-linter>=2.0",
    "bandit>=1.7",
    "pre-commit>=3.8",
    "mypy>=2.3.0",
]

# =============================================================================
# Ruff Configuration
# =============================================================================

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "RUF",  # ruff-specific
]
ignore = [
    "D100",   # Missing docstring in public module (init files)
    "D104",   # Missing docstring in public package
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S108", "S603", "S608", "D101", "D102", "D103", "D107", "ANN", "TCH", "N806", "RUF002", "RUF003"]

# =============================================================================
# pycodestyle Configuration
# =============================================================================

[tool.pycodestyle]
max-line-length = 120

# =============================================================================
# Flake8 Configuration (requires flake8-pyproject plugin)
# =============================================================================

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]

# =============================================================================
# Pylint Configuration
# =============================================================================

[tool.pylint.main]
source-roots = ["src"]
jobs = 0
py-version = "3.13"

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-instance-attributes",
    "fixme",
    "import-error",
]

[tool.pylint.design]
max-args = 8
max-returns = 8
max-locals = 20

[tool.pylint.similarities]
min-similarity-lines = 6
ignore-imports = true

# =============================================================================
# BasedPyright Configuration
# =============================================================================

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

# =============================================================================
# Mypy Configuration
# =============================================================================

[tool.mypy]
python_version = "3.13"
mypy_path = ["src"]
packages = ["debcraft"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# =============================================================================
# Pytest Configuration
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'unit and not slow' --strict-markers -vv"
filterwarnings = [
    # Typer/Click creates coroutines during parameter introspection on Python 3.13
    # that are never awaited — this is a known compatibility issue, not a bug in our code.
    "ignore:coroutine '_run_sync' was never awaited:RuntimeWarning",
    # aiosqlite's background worker thread races with event loop closure between tests.
    # This is a known upstream timing issue, not a bug in our code.
    "ignore:Exception in thread.*_connection_worker_thread:pytest.PytestUnhandledThreadExceptionWarning",
]
markers = [
    # Type markers
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (may need external resources)",
    "contract: Contract tests (API boundary verification)",
    "architecture: Architecture compliance tests",
    "benchmark: Performance benchmark tests",
    "regression: Regression tests for fixed bugs",
    "e2e: End-to-end tests",
    # Feature markers
    "repository: Repository operations",
    "package: Package analysis",
    "dep5: DEP-5 copyright parsing",
    "license: License detection and normalization",
    "spdx: SPDX document generation",
    "cyclonedx: CycloneDX SBOM generation",
    "docker: Docker image analysis",
    "oci: OCI image operations",
    "iso: ISO image operations",
    "qcow2: QCOW2 image operations",
    "ami: AMI image operations",
    "mirror: Repository mirroring",
    "workflow: Workflow orchestration",
    "plugin: Plugin system",
    "storage: Storage operations",
    "database: Database operations",
    # Environment markers
    "sqlite: Requires SQLite",
    "network: Requires network access",
    "filesystem: Requires filesystem operations",
    "aws: Requires AWS credentials",
    "container: Requires container runtime",
    "cross_platform: Must work on all platforms",
    "linux_only: Linux-specific test",
    "windows_only: Windows-specific test",
    "macos_only: macOS-specific test",
    # Speed markers
    "slow: Slow-running test",
    "serial: Must run serially",
    "parallel: Safe for parallel execution",
]

# =============================================================================
# Coverage Configuration
# =============================================================================

[tool.coverage.run]
source = ["debcraft"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

# =============================================================================
# Import Linter Configuration
# =============================================================================

[tool.importlinter]
root_packages = ["debcraft"]

[[tool.importlinter.contracts]]
name = "Domain independence"
type = "forbidden"
source_modules = ["debcraft.domain"]
forbidden_modules = ["debcraft.infrastructure"]

[[tool.importlinter.contracts]]
name = "Contracts purity"
type = "forbidden"
source_modules = ["debcraft.platform.contracts"]
forbidden_modules = ["debcraft.infrastructure", "debcraft.plugins", "debcraft.platform.kernel"]

[[tool.importlinter.contracts]]
name = "Plugin isolation"
type = "independence"
modules = ["debcraft.plugins"]
